<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Noah Hamm, developer at Relay Collective (@maxiomattic on GitHub)">
  <style>
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) 0.1s both; }
    .spin { transform-origin: 150px 118px; animation: spin 9s linear infinite; }
    .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: halo 3.6s ease-out 1.1s infinite; }
    .float { animation: float 6s ease-in-out 0.1s infinite; }
    @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes halo { 0% { transform: scale(1); opacity: .5; } 100% { transform: scale(1.45); opacity: 0; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F766E"/><stop offset="1" stop-color="#C2850F"/></linearGradient>
    <clipPath id="face"><circle cx="150" cy="118" r="62"/></clipPath>
  </defs>
  <g class="rise">
    <rect x="6" y="6" width="288" height="288" rx="28" fill="#F7F4EE" stroke="#C9D6D3"/>
    <circle class="halo" cx="150" cy="118" r="74" fill="none" stroke="#0F766E" stroke-width="2"/>
    <g class="float">
      <circle class="spin" cx="150" cy="118" r="72" fill="none" stroke="url(#ring)" stroke-width="4" stroke-linecap="round" stroke-dasharray="300 152"/>
      <circle cx="150" cy="118" r="65" fill="#FFFFFF"/>
      <image clip-path="url(#face)" x="88" y="56" width="124" height="124" preserveAspectRatio="xMidYMid slice" href="data:image/jpeg;base64," xlink:href="data:image/jpeg;base64,"/>
    </g>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">
      <text x="150" y="232" font-size="21" font-weight="700" fill="#1C2B33">Noah Hamm</text>
      <text x="150" y="258" font-size="15" fill="#5B6B73">@maxiomattic</text>
    </g>
  </g>
</svg>
