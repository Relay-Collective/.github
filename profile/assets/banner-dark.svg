<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Relay Collective: technology that brings communities together.">
  <style>
    .edge { stroke: #2E3D44; stroke-width: 2; stroke-dasharray: 1; animation: draw 1.4s cubic-bezier(.6,0,.3,1) both; }
    .pop { transform-box: fill-box; transform-origin: center; animation: pop .7s cubic-bezier(.3,1.6,.5,1) both; }
    .breathe { transform-box: fill-box; transform-origin: center; animation: breathe 4s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: halo 3.2s ease-out infinite; }
    .rise { animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    .bar { animation: grow 1.2s cubic-bezier(.2,.8,.2,1) .9s both; transform-origin: 72px 0; }
    .drift { animation: drift 14s ease-in-out infinite alternate; }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
    @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
    @keyframes halo { 0% { transform: scale(1); opacity: .7; } 100% { transform: scale(4.5); opacity: 0; } }
    @keyframes rise { from { transform: translateY(14px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-40px, 20px); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#2DD4BF"/><stop offset=".5" stop-color="#F5B942"/><stop offset="1" stop-color="#FF7A59"/></linearGradient>
    <clipPath id="card"><rect width="1280" height="340" rx="24"/></clipPath>
  </defs>
  <rect width="1280" height="340" rx="24" fill="#151B23"/>
  <g clip-path="url(#card)">
    <circle class="drift" cx="1150" cy="30" r="200" fill="#1A2A2E" opacity=".7"/>
    <circle class="drift" style="animation-delay:-7s" cx="760" cy="360" r="140" fill="#1A2A2E" opacity=".5"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text class="rise" style="animation-delay:.1s" x="72" y="118" font-size="19" font-weight="700" letter-spacing="4" fill="#2DD4BF">NON-PROFIT · COMMUNITY · TECHNOLOGY</text>
    <text class="rise" style="animation-delay:.25s" x="69" y="190" font-size="66" font-weight="800" fill="#E6EDF3">Relay Collective</text>
    <text class="rise" style="animation-delay:.45s" x="72" y="240" font-size="26" fill="#9AA7B1">Technology that brings communities together.</text>
    <rect class="bar" x="72" y="266" width="120" height="6" rx="3" fill="url(#g)"/>
  </g>
  <g><line class="edge" style="animation-delay:0.30s" x1="720" y1="150" x2="790" y2="80" pathLength="1"/><line class="edge" style="animation-delay:0.35s" x1="720" y1="150" x2="800" y2="230" pathLength="1"/><line class="edge" style="animation-delay:0.40s" x1="720" y1="150" x2="880" y2="150" pathLength="1"/><line class="edge" style="animation-delay:0.45s" x1="790" y1="80" x2="880" y2="150" pathLength="1"/><line class="edge" style="animation-delay:0.50s" x1="790" y1="80" x2="900" y2="60" pathLength="1"/><line class="edge" style="animation-delay:0.55s" x1="800" y1="230" x2="880" y2="150" pathLength="1"/><line class="edge" style="animation-delay:0.60s" x1="800" y1="230" x2="930" y2="260" pathLength="1"/><line class="edge" style="animation-delay:0.65s" x1="800" y1="230" x2="840" y2="300" pathLength="1"/><line class="edge" style="animation-delay:0.70s" x1="880" y1="150" x2="900" y2="60" pathLength="1"/><line class="edge" style="animation-delay:0.75s" x1="880" y1="150" x2="990" y2="120" pathLength="1"/><line class="edge" style="animation-delay:0.80s" x1="880" y1="150" x2="1010" y2="210" pathLength="1"/><line class="edge" style="animation-delay:0.85s" x1="880" y1="150" x2="930" y2="260" pathLength="1"/><line class="edge" style="animation-delay:0.90s" x1="900" y1="60" x2="990" y2="120" pathLength="1"/><line class="edge" style="animation-delay:0.95s" x1="930" y1="260" x2="1010" y2="210" pathLength="1"/><line class="edge" style="animation-delay:1.00s" x1="930" y1="260" x2="840" y2="300" pathLength="1"/><line class="edge" style="animation-delay:1.05s" x1="930" y1="260" x2="1040" y2="290" pathLength="1"/><line class="edge" style="animation-delay:1.10s" x1="990" y1="120" x2="1010" y2="210" pathLength="1"/><line class="edge" style="animation-delay:1.15s" x1="990" y1="120" x2="1080" y2="70" pathLength="1"/><line class="edge" style="animation-delay:1.20s" x1="990" y1="120" x2="1100" y2="160" pathLength="1"/><line class="edge" style="animation-delay:1.25s" x1="1010" y1="210" x2="1100"