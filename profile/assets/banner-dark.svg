  <g><circle class="halo" style="animation-delay:2.0s" cx="880" cy="150" r="14" fill="none" stroke="#2DD4BF" stroke-width="2"/><circle class="halo" style="animation-delay:3.6s" cx="880" cy="150" r="14" fill="none" stroke="#2DD4BF" stroke-width="2"/><circle class="halo" style="animation-delay:3.1s" cx="1010" cy="210" r="11" fill="none" stroke="#FF7A59" stroke-width="2"/><circle class="halo" style="animation-delay:4.7s" cx="1010" cy="210" r="11" fill="none" stroke="#FF7A59" stroke-width="2"/><circle class="halo" style="animation-delay:4.2s" cx="1180" cy="110" r="10" fill="none" stroke="#FF7A59" stroke-width="2"/><circle class="halo" style="animation-delay:5.8s" cx="1180" cy="110" r="10" fill="none" stroke="#FF7A59" stroke-width="2"/></g>
