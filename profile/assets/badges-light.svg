  </g><g class="rise" style="animation-delay:0.40s">
    <rect x="448.0" y="14" width="370" height="56" rx="28.0" fill="#FFFFFF"/>
    <rect x="448.0" y="14" width="370" height="56" rx="28.0" fill="#C2850F" fill-opacity=".09" stroke="#C2850F" stroke-opacity=".55" stroke-width="1.5"/>
