<svg xmlns="http://www.w3.org/2000/svg" width="960" height="160" viewBox="0 0 960 160" role="img" aria-label="Non-profit, social impact. Born at FaithTech HACKVAN 2026. In partnership with The Salvation Army – Belkin Communities of Hope.">
  <style>
    .rise { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
    .shine { animation: shine 5s ease-in-out infinite; }
    .halo { transform-box: fill-box; transform-origin: center; opacity: 0; animation: halo 2.6s ease-out infinite; }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
    @keyframes shine { 0% { transform: translateX(0); } 40%, 100% { transform: translateX(900px); } }
    @keyframes halo { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs><linearGradient id="sheenteal" x1="0" x2="1"><stop offset="0" stop-color="#0F766E" stop-opacity="0"/><stop offset=".5" stop-color="#0F766E" stop-opacity=".22"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></linearGradient><linearGradient id="sheenamber" x1="0" x2="1"><stop offset="0" stop-color="#C2850F" stop-opacity="0"/><stop offset=".5" stop-color="#C2850F" stop-opacity=".22"/><stop offset="1" stop-color="#C2850F" stop-opacity="0"/></linearGradient><linearGradient id="sheencoral" x1="0" x2="1"><stop offset="0" stop-color="#E4572E" stop-opacity="0"/><stop offset=".5" stop-color="#E4572E" stop-opacity=".22"/><stop offset="1" stop-color="#E4572E" stop-opacity="0"/></linearGradient><clipPath id="c0"><rect x="142.0" y="14" width="286" height="56" rx="28.0"/></clipPath><clipPath id="c1"><rect x="448.0" y="14" width="370" height="56" rx="28.0"/></clipPath><clipPath id="c2"><rect x="148.0" y="90" width="664" height="56" rx="28.0"/></clipPath></defs>
